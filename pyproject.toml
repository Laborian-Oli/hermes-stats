[project]
name = "hstats"
version = "1.0.0"
description = "Hermes 用量与成本数据层：只读 state.db，独立于 Desktop 与 gateway 运行"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
hstats = "hstats.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hstats"]